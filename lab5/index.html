<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>聖誕樹</title>
</head>
<body>
<h2>打開瀏覽器的 Console 看聖誕樹</h2>
<script>

    function tree(n) {

      for (let i = 0; i < n; i++) {

        console.log(" ".repeat(n - i - 1) + "*".repeat(2 * i + 1));

      }

      for (let i = 0; i < 2; i++) {

        console.log(" ".repeat(n - 1) + "*");

      }

    }

    tree(5); 
</script>
</body>
</html>
